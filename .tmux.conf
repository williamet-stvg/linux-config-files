# ~/.tmux.conf
#
# Reload in a running server with:  prefix + r   (bound at the bottom)
 
# ---------------------------------------------------------------------------
# TERMINAL / COLOURS
# ---------------------------------------------------------------------------
# This was missing, and it is why colours look wrong inside tmux even when
# they are fine outside it. tmux defaults to "screen", an 8-colour terminal,
# so vim's 256-colour and truecolour settings had nothing to work with.
# tmux-256color terminfo is absent on some older Ubuntu images, so fall back.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
 
# Pass 24-bit colour through to applications (vim's termguicolors).
set -ga terminal-overrides ',*256col*:Tc'
set -ga terminal-overrides ',xterm-256color:Tc'
 
# No delay after Esc — otherwise vim feels sluggish inside tmux.
set -sg escape-time 10
set -g focus-events on
 
# ---------------------------------------------------------------------------
# GENERAL
# ---------------------------------------------------------------------------
set -g mouse on
 
# NOTE: with mouse on, dragging selects into tmux's copy-mode buffer instead
# of the terminal's own selection. Hold Shift while dragging to get the
# native Windows Terminal / gnome-terminal selection back.
 
# Remap prefix from C-b to C-a.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
 
# Don't rename windows automatically.
set-option -g allow-rename off
set-option -g automatic-rename off
 
# History. 3000 is quite low — a single verbose build overruns it. Raised;
# lower it again if you are deliberately capping memory.
set-option -g history-limit 50000
 
# Start windows and panes at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
 
# ---------------------------------------------------------------------------
# PANES / WINDOWS
# ---------------------------------------------------------------------------
# Split with | and -, and inherit the current pane's working directory
# (the original opened every new pane in $HOME).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %
 
# Switch panes with Alt+arrow, no prefix.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
 
# Resize with prefix + H/J/K/L (repeatable).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# Vim-style copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
 
# WSL: send the tmux copy buffer to the Windows clipboard.
if-shell 'command -v clip.exe >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"'
 
# ---------------------------------------------------------------------------
# DESIGN
# ---------------------------------------------------------------------------
# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
 
# FIXED: this was `set -g bell-action non`, which is not a valid value.
# tmux rejects the line with "invalid value" on startup. Valid values are
# any | none | current | other.
set -g bell-action none
 
# Status bar, tuned to the same palette as the terminal profile
# (background rgb(24,39,43) = #18272b).
set -g status-style 'bg=#18272b fg=#9fb3b8'
set -g status-left  ' #[bold]#S#[default] '
set -g status-left-length 30
set -g status-right '#[fg=#9fb3b8]%Y-%m-%d %H:%M '
set -g status-right-length 40
setw -g window-status-current-style 'fg=#18272b bg=#5fafaf bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '
set -g pane-border-style 'fg=#2f4247'
set -g pane-active-border-style 'fg=#5fafaf'
set -g message-style 'bg=#5fafaf fg=#18272b bold'
 
# ---------------------------------------------------------------------------
# RELOAD
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

